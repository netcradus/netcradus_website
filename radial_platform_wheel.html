<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Cyber Security Platform - Radial Architecture</title>
  
  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #06030b;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(169, 92, 255, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 50% 85%, rgba(255, 79, 163, 0.12) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Title Header */
    .header {
      text-align: center;
      margin-bottom: 20px;
      z-index: 10;
    }

    .main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #ff8ad8 70%, #ff52a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(255, 82, 160, 0.3);
    }

    .subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 700;
      letter-spacing: 0.3em;
      color: #bfa8e6;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Graphic Wrapper */
    .graphic-wrapper {
      position: relative;
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 1400 / 840;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* CSS Animations */
    .spin-ring {
      transform-origin: 700px 670px;
      animation: spin 60s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spin-ring {
        animation: none;
      }
    }

    /* Bottom Pipeline Banner */
    .bottom-banner {
      width: 100%;
      max-width: 1180px;
      margin-top: -65px;
      z-index: 20;
      position: relative;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 18px 32px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6),
        0 0 30px rgba(255, 79, 163, 0.25);
      color: #120626;
      text-align: center;
    }

    .banner-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: #1a0836;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .banner-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-around;
      gap: 16px;
      padding-top: 6px;
      border-top: 1px solid rgba(18, 6, 38, 0.12);
    }

    .banner-item {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(12px, 1.4vw, 14px);
      font-weight: 700;
      color: #3b176e;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .banner-item:not(:last-child)::after {
      content: "•";
      color: #ff52a0;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .bottom-banner {
        margin-top: -30px;
        padding: 16px 20px;
      }
      .banner-item:not(:last-child)::after {
        display: none;
      }
      .banner-grid {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
