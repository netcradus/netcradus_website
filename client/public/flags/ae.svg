    <rect width="60" height="60" rx="9" ry="9"/>
  </clipPath>
  <g clip-path="url(#ae_clip)">
    <!-- Right 3 horizontal stripes -->
    <rect x="16" y="0" width="44" height="20" fill="#007A3D"/>
    <rect x="16" y="20" width="44" height="20" fill="#FFFFFF"/>
    <rect x="16" y="40" width="44" height="20" fill="#000000"/>
